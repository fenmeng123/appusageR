<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1150" role="img" aria-labelledby="title desc">
  <title id="title">appusageR package logo</title>
  <desc id="desc">A regular hexagonal appusageR logo with a smartphone, mobile sensing signals, and app-usage data marks.</desc>
  <defs>
    <linearGradient id="hex-fill" x1="170" y1="130" x2="830" y2="1020" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B3954"/>
      <stop offset="0.52" stop-color="#087E8B"/>
      <stop offset="1" stop-color="#1B998B"/>
    </linearGradient>
    <linearGradient id="phone-fill" x1="355" y1="310" x2="655" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF6F6"/>
    </linearGradient>
    <linearGradient id="screen-fill" x1="394" y1="380" x2="606" y2="745" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F9FEFF"/>
      <stop offset="1" stop-color="#DDF5F0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#06202F" flood-opacity="0.28"/>
    </filter>
    <filter id="tiny-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#06202F" flood-opacity="0.24"/>
    </filter>
    <style>
      .font-main { font-family: "Segoe UI", Arial, sans-serif; }
      .label { fill: #F7FBFC; font-weight: 800; }
      .subtle { fill: #BDECE8; font-weight: 700; }
      .stroke-soft { stroke: #D9F5F0; stroke-width: 10; stroke-linecap: round; fill: none; opacity: 0.68; }
      .stroke-accent { stroke: #FFD166; stroke-width: 12; stroke-linecap: round; fill: none; opacity: 0.95; }
    </style>
  </defs>

  <path d="M500 40 L963.3 307.5 L963.3 842.5 L500 1110 L36.7 842.5 L36.7 307.5 Z" fill="#06283D"/>
  <path d="M500 70 L937.3 322.5 L937.3 827.5 L500 1080 L62.7 827.5 L62.7 322.5 Z" fill="url(#hex-fill)"/>
  <path d="M500 105 L907 340 L907 810 L500 1045 L93 810 L93 340 Z" fill="none" stroke="#EAF6F6" stroke-width="12" opacity="0.88"/>

  <g class="font-main" text-anchor="middle">
    <text x="500" y="265" class="subtle" font-size="32">MOBILE SENSING</text>
  </g>

  <g opacity="0.9">
    <path class="stroke-soft" d="M244 507 C191 559 191 641 244 693"/>
    <path class="stroke-soft" d="M207 456 C122 540 122 660 207 744"/>
    <path class="stroke-accent" d="M756 507 C809 559 809 641 756 693"/>
    <path class="stroke-accent" d="M793 456 C878 540 878 660 793 744"/>
    <circle cx="244" cy="600" r="18" fill="#FFD166" filter="url(#tiny-shadow)"/>
    <circle cx="756" cy="600" r="18" fill="#FF6B6B" filter="url(#tiny-shadow)"/>
  </g>

  <g opacity="0.78" stroke="#D9F5F0" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 17">
    <path d="M315 402 C265 365 238 331 218 287"/>
    <path d="M685 402 C735 365 762 331 782 287"/>
    <path d="M315 790 C265 827 238 861 218 905"/>
    <path d="M685 790 C735 827 762 861 782 905"/>
  </g>
  <g filter="url(#tiny-shadow)">
    <circle cx="218" cy="287" r="25" fill="#FF6B6B"/>
    <circle cx="782" cy="287" r="25" fill="#FFD166"/>
    <circle cx="218" cy="905" r="25" fill="#8FD694"/>
    <circle cx="782" cy="905" r="25" fill="#6EC6FF"/>
    <circle cx="218" cy="287" r="9" fill="#F7FBFC"/>
    <circle cx="782" cy="287" r="9" fill="#F7FBFC"/>
    <circle cx="218" cy="905" r="9" fill="#F7FBFC"/>
    <circle cx="782" cy="905" r="9" fill="#F7FBFC"/>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="352" y="304" width="296" height="525" rx="50" fill="#082A3A"/>
    <rect x="369" y="321" width="262" height="491" rx="40" fill="url(#phone-fill)"/>
    <rect x="405" y="347" width="190" height="20" rx="10" fill="#082A3A" opacity="0.86"/>
    <rect x="392" y="391" width="216" height="330" rx="28" fill="url(#screen-fill)" stroke="#C2EDE6" stroke-width="6"/>
    <circle cx="500" cy="767" r="20" fill="#D9F5F0" stroke="#9ADBD2" stroke-width="5"/>
  </g>

  <g>
    <rect x="426" y="425" width="148" height="42" rx="18" fill="#0B3954" opacity="0.94"/>
    <circle cx="454" cy="446" r="9" fill="#FFD166"/>
    <rect x="474" y="439" width="74" height="13" rx="7" fill="#D9F5F0"/>

    <rect x="425" y="505" width="30" height="135" rx="12" fill="#6EC6FF"/>
    <rect x="468" y="470" width="30" height="170" rx="12" fill="#8FD694"/>
    <rect x="511" y="535" width="30" height="105" rx="12" fill="#FFD166"/>
    <rect x="554" y="492" width="30" height="148" rx="12" fill="#FF6B6B"/>

    <path d="M425 672 C462 633 483 664 511 627 S557 601 585 556" fill="none" stroke="#0B3954" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="425" cy="672" r="12" fill="#0B3954"/>
    <circle cx="511" cy="627" r="12" fill="#0B3954"/>
    <circle cx="585" cy="556" r="12" fill="#0B3954"/>

    <g opacity="0.92">
      <circle cx="444" cy="698" r="9" fill="#FF6B6B"/>
      <circle cx="479" cy="698" r="9" fill="#FFD166"/>
      <circle cx="514" cy="698" r="9" fill="#8FD694"/>
      <circle cx="549" cy="698" r="9" fill="#6EC6FF"/>
    </g>
  </g>

  <g class="font-main" text-anchor="middle" filter="url(#tiny-shadow)">
    <text x="500" y="575" class="label" font-size="120" stroke="#06283D" stroke-width="11" stroke-linejoin="round" paint-order="stroke fill">
      <tspan>appusage</tspan><tspan fill="#FFD166">R</tspan>
    </text>
  </g>
</svg>
